<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Visual–Inertial Synchronization</title>
<desc id="desc">Method schematic, not measured data. Asynchronous camera and IMU signals are aligned using time-domain cross-correlation followed by frequency-domain phase refinement.</desc>
